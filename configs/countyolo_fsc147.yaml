# CountYOLO v4 Configuration for FSC-147 Dataset

dataset:
  name: "FSC-147"
  data_dir: "data/FSC147"
  batch_size: 4
  num_workers: 4
  sigma: 4.0 # Gaussian kernel spread cho density map

model:
  in_channels: 3
  hidden_channels: 256
  num_classes: 1 # Binary objectness (đối tượng cần đếm hay không)

training:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  
matcher:
  lambda_dens_max: 2.0
  warmup_epochs: 5
  
loss:
  use_uncertainty: true # Tự động cân bằng loss bằng thuật toán Kendall et al.
  w_density: 1.0        # Trọng số khởi tạo (nếu không dùng uncertainty)
  w_box: 1.0
  w_cls: 1.0

wandb:
  project: "CountYOLO-v4"
  name: "FSC147-Baseline"

fine_tune:
  freeze_clip: true
  freeze_backbone: true
  gradient_accumulation_steps: 4 # Phù hợp cho GPU 12GB VRAM để mô phỏng batch size lớn
  use_amp: true # Sử dụng Mixed Precision (FP16)
